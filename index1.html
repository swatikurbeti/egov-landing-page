<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eGov React - Task 2</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "DM Sans", sans-serif; color: #1a1a1a; background: #f7f9fc; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ---------- MOCK DATA ----------
    const PRODUCTS = [
      { id: 1, name: "DIGIT Urban", category: "Urban", price: "Free / Open Source", image: "https://placehold.co/340x180/dbeafe/0057a8?text=DIGIT+Urban", desc: "Platform for urban local bodies to manage citizen services." },
      { id: 2, name: "mSeva", category: "Urban", price: "Free / Open Source", image: "https://placehold.co/340x180/dbeafe/0057a8?text=mSeva", desc: "Mobile-first platform for municipal service delivery." },
      { id: 3, name: "PUCAR", category: "Legal", price: "Free / Open Source", image: "https://placehold.co/340x180/e0f2f1/007a63?text=PUCAR", desc: "Platform for urban courts and alternative dispute resolution." },
      { id: 4, name: "Health Stack", category: "Health", price: "Free / Open Source", image: "https://placehold.co/340x180/fce4ec/c62828?text=Health+Stack", desc: "Integrated digital health platform for public health systems." },
      { id: 5, name: "DIGIT Works", category: "Finance", price: "Free / Open Source", image: "https://placehold.co/340x180/fff3e0/e65100?text=DIGIT+Works", desc: "Works management platform for tracking government projects." },
      { id: 6, name: "DIGIT Finance", category: "Finance", price: "Free / Open Source", image: "https://placehold.co/340x180/fff3e0/e65100?text=DIGIT+Finance", desc: "Financial management and accounting for local governments." },
      { id: 7, name: "DIGIT HRMS", category: "Admin", price: "Free / Open Source", image: "https://placehold.co/340x180/f3e5f5/6a1b9a?text=DIGIT+HRMS", desc: "Human resource management for government departments." },
      { id: 8, name: "Birth & Death", category: "Urban", price: "Free / Open Source", image: "https://placehold.co/340x180/dbeafe/0057a8?text=Birth+%26+Death", desc: "Digital birth and death certificate issuance system." },
      { id: 9, name: "eDistrict", category: "Admin", price: "Free / Open Source", image: "https://placehold.co/340x180/f3e5f5/6a1b9a?text=eDistrict", desc: "Integrated service delivery platform for district administration." },
    ];

    const CATEGORIES = ["All", "Urban", "Health", "Legal", "Finance", "Admin"];

    // ---------- COMPONENTS ----------

    function Navbar() {
      const [menuOpen, setMenuOpen] = useState(false);
      return (
        <nav style={{ background: "#fff", boxShadow: "0 2px 10px rgba(0,0,0,0.08)", position: "sticky", top: 0, zIndex: 100 }}>
          <div style={{ maxWidth: 1200, margin: "0 auto", padding: "0 20px", display: "flex", alignItems: "center", justifyContent: "space-between", height: 64 }}>
            <div style={{ fontWeight: 800, fontSize: "1.4rem" }}>
              <span style={{ color: "#f6961e" }}>e</span><span style={{ color: "#0057a8" }}>GOV</span>
            </div>
            <div style={{ display: "flex", gap: 24, alignItems: "center" }}>
              {["Home", "Products", "About", "Contact"].map(link => (
                <a key={link} href="#" style={{ color: "#333", fontWeight: 500, textDecoration: "none", fontSize: 15 }}>{link}</a>
              ))}
              <a href="#products" style={{ background: "#f6961e", color: "#fff", padding: "8px 18px", borderRadius: 4, fontWeight: 600, textDecoration: "none", fontSize: 15 }}>Get Started</a>
            </div>
          </div>
        </nav>
      );
    }

    function HeroSection() {
      return (
        <section style={{ background: "linear-gradient(135deg, #e8f4ff 0%, #f0f8ff 100%)", padding: "70px 20px" }}>
          <div style={{ maxWidth: 1200, margin: "0 auto", display: "flex", alignItems: "center", gap: 40, flexWrap: "wrap" }}>
            <div style={{ flex: 1, minWidth: 280 }}>
              <p style={{ color: "#0057a8", fontWeight: 600, fontSize: 13, textTransform: "uppercase", letterSpacing: 1 }}>20 years of digital transformation</p>
              <h1 style={{ fontSize: "2.4rem", fontWeight: 800, lineHeight: 1.3, margin: "12px 0 16px" }}>
                Transforming Public<br />Service Delivery.<br />
                <span style={{ color: "#0057a8" }}>It's possible.</span>
              </h1>
              <p style={{ color: "#555", fontSize: "1.02rem", lineHeight: 1.7, maxWidth: 480, marginBottom: 28 }}>
                We build technology solutions that help governments deliver services efficiently to over a billion citizens across India.
              </p>
              <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                <a href="#products" style={{ background: "#f6961e", color: "#fff", padding: "11px 24px", borderRadius: 4, fontWeight: 600, textDecoration: "none" }}>Explore Products</a>
                <a href="#" style={{ background: "#0057a8", color: "#fff", padding: "11px 24px", borderRadius: 4, fontWeight: 600, textDecoration: "none" }}>Learn More</a>
              </div>
            </div>
            <div style={{ flex: 1, minWidth: 280, textAlign: "center" }}>
              <img src="https://placehold.co/520x340/d1e8ff/0057a8?text=Hero+Image" alt="Hero" style={{ width: "100%", borderRadius: 12, boxShadow: "0 16px 40px rgba(0,87,168,0.15)" }} />
            </div>
          </div>
        </section>
      );
    }

    function StatsStrip() {
      const stats = [
        { value: "1 Billion+", label: "Citizens Served" },
        { value: "50+", label: "Government Partners" },
        { value: "210+", label: "Products Deployed" },
        { value: "20 Yrs", label: "Of Experience" },
      ];
      return (
        <section style={{ background: "#1a2e4a", padding: "50px 20px" }}>
          <div style={{ maxWidth: 1200, margin: "0 auto" }}>
            <div style={{ textAlign: "center", marginBottom: 32 }}>
              <h2 style={{ color: "#fff", fontSize: "2.8rem", fontWeight: 800 }}>1,000,000,100+</h2>
              <p style={{ color: "#94b8d8" }}>Citizens impacted through our platforms</p>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 20, textAlign: "center" }}>
              {stats.map(s => (
                <div key={s.label}>
                  <h3 style={{ color: "#f6961e", fontWeight: 700, fontSize: "1.8rem" }}>{s.value}</h3>
                  <p style={{ color: "#94b8d8", fontSize: 14 }}>{s.label}</p>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    function ProductCard({ product }) {
      const [hovered, setHovered] = useState(false);
      return (
        <div
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}
          style={{
            background: "#fff",
            borderRadius: 10,
            overflow: "hidden",
            border: "1px solid #e5e5e5",
            transition: "transform 0.3s ease, box-shadow 0.3s ease",
            transform: hovered ? "translateY(-6px)" : "translateY(0)",
            boxShadow: hovered ? "0 12px 35px rgba(0,0,0,0.12)" : "0 2px 8px rgba(0,0,0,0.06)",
          }}
        >
          <img src={product.image} alt={product.name} style={{ width: "100%", height: 180, objectFit: "cover" }} />
          <div style={{ padding: 18 }}>
            <span style={{ background: "#e8f0fa", color: "#0057a8", fontSize: 12, padding: "3px 10px", borderRadius: 12, fontWeight: 600 }}>{product.category}</span>
            <h5 style={{ fontWeight: 700, marginTop: 10, marginBottom: 6 }}>{product.name}</h5>
            <p style={{ color: "#666", fontSize: 14, lineHeight: 1.5, marginBottom: 12 }}>{product.desc}</p>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ color: "#1a7f4b", fontWeight: 600, fontSize: 13 }}>{product.price}</span>
              <a href="#" style={{ background: "#0057a8", color: "#fff", padding: "6px 14px", borderRadius: 4, fontSize: 13, fontWeight: 600, textDecoration: "none" }}>View →</a>
            </div>
          </div>
        </div>
      );
    }

    function ProductsSection() {
      const [search, setSearch] = useState("");
      const [activeCategory, setActiveCategory] = useState("All");
      const [loading, setLoading] = useState(true);
      const [products, setProducts] = useState([]);

      useEffect(() => {
        // Simulate loading from mock API
        setTimeout(() => {
          setProducts(PRODUCTS);
          setLoading(false);
        }, 1200);
      }, []);

      const filtered = products.filter(p => {
        var matchCat = activeCategory === "All" || p.category === activeCategory;
        var matchSearch = p.name.toLowerCase().includes(search.toLowerCase());
        return matchCat && matchSearch;
      });

      return (
        <section id="products" style={{ background: "#f7f9fc", padding: "70px 20px" }}>
          <div style={{ maxWidth: 1200, margin: "0 auto" }}>
            <h2 style={{ fontSize: "2rem", fontWeight: 700, marginBottom: 8 }}>
              Latest at <span style={{ color: "#0057a8" }}>eGov</span>
            </h2>
            <p style={{ color: "#666", marginBottom: 28 }}>Explore our open-source products built for government use</p>

            {/* Search */}
            <div style={{ marginBottom: 20 }}>
              <input
                type="text"
                placeholder="🔍  Search products by name..."
                value={search}
                onChange={e => setSearch(e.target.value)}
                style={{
                  width: "100%",
                  maxWidth: 420,
                  padding: "11px 16px",
                  border: "2px solid #e0e0e0",
                  borderRadius: 8,
                  fontFamily: "DM Sans, sans-serif",
                  fontSize: 15,
                  outline: "none",
                  transition: "border 0.3s",
                }}
                onFocus={e => e.target.style.border = "2px solid #0057a8"}
                onBlur={e => e.target.style.border = "2px solid #e0e0e0"}
              />
            </div>

            {/* Category Filter */}
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 32 }}>
              {CATEGORIES.map(cat => (
                <button
                  key={cat}
                  onClick={() => setActiveCategory(cat)}
                  style={{
                    background: activeCategory === cat ? "#0057a8" : "transparent",
                    color: activeCategory === cat ? "#fff" : "#333",
                    border: "2px solid " + (activeCategory === cat ? "#0057a8" : "#e0e0e0"),
                    borderRadius: 20,
                    padding: "7px 18px",
                    fontSize: 14,
                    fontFamily: "DM Sans, sans-serif",
                    cursor: "pointer",
                    transition: "all 0.3s",
                    fontWeight: activeCategory === cat ? 600 : 400,
                  }}
                >
                  {cat}
                </button>
              ))}
            </div>

            {/* Loading State */}
            {loading && (
              <div style={{ textAlign: "center", padding: "60px 20px" }}>
                <div style={{
                  width: 48,
                  height: 48,
                  border: "4px solid #e0e0e0",
                  borderTop: "4px solid #0057a8",
                  borderRadius: "50%",
                  animation: "spin 0.8s linear infinite",
                  margin: "0 auto 16px",
                }} />
                <p style={{ color: "#888", fontSize: 15 }}>Loading products...</p>
                <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
              </div>
            )}

            {/* No Results */}
            {!loading && filtered.length === 0 && (
              <div style={{ textAlign: "center", padding: "60px 20px" }}>
                <div style={{ fontSize: "3rem", marginBottom: 12 }}>🔍</div>
                <h4 style={{ color: "#444", marginBottom: 8 }}>No results found</h4>
                <p style={{ color: "#888" }}>Try a different search term or select another category.</p>
                <button
                  onClick={() => { setSearch(""); setActiveCategory("All"); }}
                  style={{ background: "#0057a8", color: "#fff", border: "none", padding: "10px 22px", borderRadius: 4, fontFamily: "DM Sans, sans-serif", fontWeight: 600, cursor: "pointer", marginTop: 16 }}
                >
                  Clear Filters
                </button>
              </div>
            )}

            {/* Product Grid */}
            {!loading && filtered.length > 0 && (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 24 }}>
                {filtered.map(p => <ProductCard key={p.id} product={p} />)}
              </div>
            )}
          </div>
        </section>
      );
    }

    function CTASection() {
      return (
        <section style={{ background: "#0b1e3d", padding: "70px 20px" }}>
          <div style={{ maxWidth: 1200, margin: "0 auto", display: "flex", alignItems: "center", gap: 40, flexWrap: "wrap" }}>
            <div style={{ flex: 1, minWidth: 280 }}>
              <p style={{ color: "#f6961e", fontWeight: 600, fontSize: 13, textTransform: "uppercase", letterSpacing: 1 }}>★ DIGIT</p>
              <h2 style={{ color: "#fff", fontSize: "2rem", fontWeight: 700, lineHeight: 1.3, margin: "12px 0 16px" }}>
                Our open-source technology-for-good platform
              </h2>
              <p style={{ color: "#94b8d8", fontSize: "1rem", lineHeight: 1.7, maxWidth: 440, marginBottom: 28 }}>
                DIGIT is a scalable, configurable, and open-source platform that enables governments to deliver services digitally. Built for billions, designed for everyone.
              </p>
              <a href="#" style={{ background: "#f6961e", color: "#fff", padding: "11px 24px", borderRadius: 4, fontWeight: 600, textDecoration: "none" }}>Explore DIGIT</a>
            </div>
            <div style={{ flex: 1, minWidth: 280, textAlign: "center" }}>
              <img src="https://placehold.co/480x300/1e3a6e/94b8d8?text=DIGIT+Platform" alt="DIGIT" style={{ width: "100%", borderRadius: 12 }} />
            </div>
          </div>
        </section>
      );
    }

    function Footer() {
      return (
        <footer style={{ background: "#0b1e3d", borderTop: "1px solid #1e3a6e", padding: "50px 20px 24px" }}>
          <div style={{ maxWidth: 1200, margin: "0 auto" }}>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 32, marginBottom: 40 }}>
              <div>
                <div style={{ fontWeight: 800, fontSize: "1.4rem", marginBottom: 12 }}>
                  <span style={{ color: "#f6961e" }}>e</span><span style={{ color: "#fff" }}>GOV</span>
                </div>
                <p style={{ color: "#94b8d8", fontSize: 14, lineHeight: 1.7, maxWidth: 240 }}>
                  Transforming public service delivery through technology.
                </p>
              </div>
              <div>
                <h6 style={{ color: "#fff", fontWeight: 700, marginBottom: 16 }}>Quick Links</h6>
                {["Home", "Products", "About Us", "Careers"].map(l => (
                  <div key={l} style={{ marginBottom: 10 }}>
                    <a href="#" style={{ color: "#94b8d8", fontSize: 14, textDecoration: "none" }}>{l}</a>
                  </div>
                ))}
              </div>
              <div>
                <h6 style={{ color: "#fff", fontWeight: 700, marginBottom: 16 }}>Products</h6>
                {["DIGIT Urban", "PUCAR", "Health Stack", "DIGIT Finance"].map(l => (
                  <div key={l} style={{ marginBottom: 10 }}>
                    <a href="#" style={{ color: "#94b8d8", fontSize: 14, textDecoration: "none" }}>{l}</a>
                  </div>
                ))}
              </div>
              <div>
                <h6 style={{ color: "#fff", fontWeight: 700, marginBottom: 16 }}>Subscribe Now</h6>
                <p style={{ color: "#94b8d8", fontSize: 14, marginBottom: 12 }}>Get updates on our latest products.</p>
                <div style={{ display: "flex", borderRadius: 4, overflow: "hidden" }}>
                  <input type="email" placeholder="Your email" style={{ flex: 1, padding: "10px 12px", border: "none", fontFamily: "DM Sans, sans-serif", fontSize: 14, outline: "none" }} />
                  <button style={{ background: "#f6961e", border: "none", padding: "10px 14px", color: "#fff", cursor: "pointer" }}>→</button>
                </div>
              </div>
            </div>
            <div style={{ borderTop: "1px solid #1e3a6e", paddingTop: 20, display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
              <p style={{ color: "#94b8d8", fontSize: 13 }}>© 2025 eGov Foundation. All rights reserved.</p>
              <div style={{ display: "flex", gap: 20 }}>
                <a href="#" style={{ color: "#94b8d8", fontSize: 13, textDecoration: "none" }}>Privacy Policy</a>
                <a href="#" style={{ color: "#94b8d8", fontSize: 13, textDecoration: "none" }}>Terms of Use</a>
              </div>
            </div>
          </div>
        </footer>
      );
    }

    function App() {
      return (
        <div>
          <Navbar />
          <HeroSection />
          <StatsStrip />
          <ProductsSection />
          <CTASection />
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
